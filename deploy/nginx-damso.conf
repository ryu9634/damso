# /etc/nginx/sites-available/damso 로 설치한다. (provision.sh 가 처리)
#
# 이 파일은 HTTP(80) 만 정의한다. TLS 는 certbot 이 붙인다:
#   sudo certbot --nginx -d 도메인
# certbot 이 443 서버 블록과 80→443 리다이렉트를 이 파일에 직접 추가하고, 갱신도 자동으로 걸어준다.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    # 사진 업로드 한도. 애플리케이션 설정(max-request-size: 10MB)보다 커야 한다.
    # 여기가 더 작으면 앱까지 닿기도 전에 nginx 가 413 을 돌려준다.
    client_max_body_size 12m;

    # 업로드는 느린 회선에서 오래 걸린다.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    access_log /var/log/nginx/damso.access.log;
    error_log  /var/log/nginx/damso.error.log;

    # 개발 전용 경로가 어떤 이유로든 켜져 있더라도 밖에서는 닿을 수 없게 막는다.
    location /h2-console {
        return 404;
    }

    # 헬스체크는 배포 스크립트가 서버 안에서(127.0.0.1:8080) 직접 호출한다. 외부에는 열지 않는다.
    location /api/health {
        return 404;
    }

    # 해시가 붙은 정적 자산 — 내용이 바뀌면 파일명이 바뀌므로 길게 캐시해도 안전하다.
    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 업로드된 사진 — 파일명이 UUID 라 재사용되지 않는다.
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 앱이 https 로 인식하도록 원래 스킴을 넘긴다 (application-prod.yml 의 forward-headers-strategy).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # SPA 진입점(index.html)은 캐시되면 배포 후에도 옛 화면이 남는다.
        add_header Cache-Control "no-store" always;
    }
}