# Cloudflare Tunnel 설정 — CLI 로 터널을 만들었을 때만 쓴다.
#
# Zero Trust 대시보드에서 터널을 만들고 토큰으로 설치하는 방법을 권한다
# (docs/LOCAL_SERVER.md 참고). 그 방법은 공개 호스트명 설정이 Cloudflare 쪽에 저장되므로
# 이 파일이 필요 없고, 도메인을 바꿀 때도 PC 를 건드리지 않는다.
#
# CLI 로 할 때 설치 위치 — 서비스는 SYSTEM 계정으로 돌기 때문에 그 계정의 홈을 본다:
#   C:\Windows\System32\config\systemprofile\.cloudflared\config.yml
#
#   cloudflared tunnel login
#   cloudflared tunnel create damso
#   cloudflared tunnel route dns damso 도메인            # 예: damso.example.com
#   (이 파일을 위 경로에 복사하고 아래 두 값을 채운다)
#   cloudflared service install
#
# 고칠 값 두 개: tunnel(터널 UUID), credentials-file(터널 생성 때 만들어진 json 경로)

tunnel: 터널-UUID-를-넣는다
credentials-file: C:\Windows\System32\config\systemprofile\.cloudflared\터널-UUID.json

# 연결이 끊겼을 때 다시 붙는 동안 손님에게 502 를 덜 보이게 한다.
retries: 10
# 로그. 문제가 생기면 여기부터 본다.
loglevel: info
logfile: C:\damso\logs\cloudflared.log

ingress:
  # 손님과 관리자가 쓰는 주소. 앱은 127.0.0.1:8080 에만 열려 있고,
  # 공유기 포트포워딩은 하지 않는다 — 외부에서 집 IP 로 직접 닿을 수 없다.
  - hostname: 도메인-을-넣는다
    service: http://127.0.0.1:8080
    originRequest:
      # 사진 업로드는 느린 회선에서 오래 걸린다. nginx 의 proxy_read_timeout 120s 와 같은 뜻.
      connectTimeout: 30s
      # 같은 PC 안이라 TLS 가 필요 없다. Cloudflare ↔ cloudflared 구간은 이미 암호화된다.
      noTLSVerify: true

  # 위에 해당하지 않는 요청은 거절한다. ingress 마지막 규칙은 catch-all 이어야 한다.
  - service: http_status:404
