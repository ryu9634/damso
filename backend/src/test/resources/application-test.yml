### 통합 테스트 프로파일.
### DB 접속 정보는 Testcontainers(@ServiceConnection)가 넣으므로 여기에 적지 않는다.

# 테스트마다 같은 키를 쓴다. 키 파일을 만들지 않으므로 작업 디렉터리를 더럽히지 않는다.
# (32바이트를 base64 로 인코딩한 값. 테스트 전용이며 실제 데이터에 쓰면 안 된다)
DAMSO_DATA_KEY: dGVzdC1vbmx5LWtleS0zMi1ieXRlcy1sb25nISEhISE=

damso:
  uploads: ${java.io.tmpdir}/damso-test-uploads
  seed-test-user: false

logging:
  level:
    com.damso.match: INFO
    org.hibernate.SQL: WARN
