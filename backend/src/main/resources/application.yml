### 공통 설정.
### 개발 편의 설정(Swagger · 느슨한 CORS · 테스트 계정)은 application-dev.yml 에 있다.
### 프로파일을 지정하지 않으면 dev 로 동작한다.
spring:
  application:
    name: damso-match

  profiles:
    default: dev

  # DB 는 PostgreSQL 하나만 쓴다. 로컬은 루트의 docker-compose.yml 로 띄운다.
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:damso}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:damso}
    password: ${DB_PASSWORD:damso}
    hikari:
      pool-name: damso-pool
      maximum-pool-size: 10
      # 풀이 바닥났을 때 기본 30초를 기다리면 요청과 헬스체크가 같이 멈춘다. 빨리 실패시킨다.
      connection-timeout: 5000
      validation-timeout: 3000
      # 커넥션을 60초 넘게 붙잡고 있으면 로그에 스택트레이스를 남긴다. (경고만 할 뿐 끊지는 않는다)
      leak-detection-threshold: 60000

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

  # 스키마는 Flyway 가 만든다 (db/migration/V*.sql). Hibernate 는 엔티티와 테이블이 맞는지 확인만 한다.
  # 엔티티에 컬럼을 추가·변경하면 반드시 V{다음번호}__설명.sql 을 함께 만든다. 안 만들면 기동이 실패한다.
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

damso:
  # 테스트 계정(test/test1234) 생성 여부. dev 프로파일에서만 켠다.
  seed-test-user: false

  # 업로드된 소개팅 사진 저장 위치.
  uploads: ${DAMSO_UPLOADS:./uploads}

  # 간편로그인 앱 키 — 값이 비어 있으면 앱 화면에 해당 버튼이 나오지 않는다.
  # 발급 후 환경변수(KAKAO_CLIENT_ID 등)로 넣는다.
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      redirect-uri: ${NAVER_REDIRECT_URI:}

# API 문서. 기본으로 닫혀 있고 DAMSO_SWAGGER=true 로만 연다. (dev 는 application-dev.yml 에서 켠다)
springdoc:
  api-docs:
    enabled: ${DAMSO_SWAGGER:false}
  swagger-ui:
    enabled: ${DAMSO_SWAGGER:false}
    # 새로고침해도 Authorize 에 넣은 토큰이 유지되게 한다.
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: alpha
  default-produces-media-type: application/json

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  shutdown: graceful

logging:
  level:
    root: INFO
    com.damso.match: INFO
    org.hibernate.SQL: WARN
