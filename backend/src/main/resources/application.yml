### 모든 환경 공통 설정.
### DB · 로깅 · CORS 처럼 환경마다 달라지는 값은 application-dev.yml / application-prod.yml 에 있다.
### 프로파일을 지정하지 않으면 dev 로 동작하므로, 로컬 실행 방법은 예전과 같다.
spring:
  application:
    name: damso-match

  profiles:
    default: dev

  # 커넥션 풀(HikariCP) 공통 설정. 풀 크기는 DB 마다 달라서 프로파일 파일에 둔다.
  datasource:
    hikari:
      pool-name: damso-pool
      # 풀이 바닥났을 때 기본 30초를 기다리면 요청과 헬스체크가 같이 멈춘다. 빨리 실패시킨다.
      connection-timeout: 5000
      validation-timeout: 3000
      # 커넥션을 60초 넘게 붙잡고 있으면 로그에 스택트레이스를 남긴다. (경고만 할 뿐 끊지는 않는다)
      leak-detection-threshold: 60000

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

  # 스키마는 Flyway 가 만든다 (db/migration/V*.sql). Hibernate 는 엔티티와 테이블이 맞는지 확인만 한다.
  # 엔티티에 컬럼을 추가·변경하면 반드시 V{다음번호}__설명.sql 을 함께 만든다. 안 만들면 기동이 실패한다.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway 도입 전부터 있던 DB(ddl-auto 로 만든 것)는 V1 을 건너뛰고 "V1 까지 적용됨"으로 표시한다.
    # 빈 DB 는 이 설정과 상관없이 V1 부터 실행한다.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: ddl-auto 로 만들어진 기존 스키마

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

damso:
  # 업로드된 소개팅 사진 저장 위치. 운영에서는 릴리스 디렉터리 바깥을 가리켜야 한다.
  uploads: ${DAMSO_UPLOADS:./uploads}

  # 간편로그인 앱 키 — 값이 비어 있으면 앱 화면에 해당 버튼이 나오지 않는다.
  # 발급 후 환경변수(KAKAO_CLIENT_ID 등)로 넣는다. 운영에서는 /etc/damso/damso.env 에 둔다.
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      redirect-uri: ${NAVER_REDIRECT_URI:}

# API 문서. 운영에서는 기본으로 닫혀 있고 DAMSO_SWAGGER=true 로만 연다. (dev 는 application-dev.yml 에서 켠다)
springdoc:
  api-docs:
    enabled: ${DAMSO_SWAGGER:false}
  swagger-ui:
    enabled: ${DAMSO_SWAGGER:false}
    # 새로고침해도 Authorize 에 넣은 토큰이 유지되게 한다.
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: alpha
  default-produces-media-type: application/json

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /