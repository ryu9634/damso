### 집 PC 운영 프로파일 (윈도우 + H2 파일 DB + Cloudflare Tunnel).
###
### dev 와 prod 의 중간이 아니라, "prod 의 보안 설정을 그대로 두고 DB 만 H2 로 바꾼" 것이다.
### dev 프로파일로 손님을 받으면 H2 콘솔이 열리고 테스트 계정이 생기고 CORS 가 풀려 있으므로,
### 집에서 돌릴 때도 반드시 이 프로파일을 쓴다.
###
###   java -jar match.jar --spring.profiles.active=local
###
### 비밀·경로 값은 이 파일에 적지 않는다. 윈도우 PC 의 C:\damso\damso.env 에서 환경변수로 들어온다.
### (deploy/windows/damso.env.example 참고)
spring:
  datasource:
    # URL 옵션은 dev 프로파일과 한 글자도 다르면 안 된다. 식별자 대소문자 처리(DATABASE_TO_LOWER)가
    # 달라지면 같은 .mv.db 파일을 열어도 테이블을 못 찾는다. 이전 스크립트도 같은 옵션을 쓴다.
    #
    # AUTO_SERVER 는 켜지 않는다. 켜면 H2 가 LAN 에 TCP 포트(9092)를 열고, sa 계정은 비밀번호가
    # 없다. 집 공유기 안이라도 열어 둘 이유가 없다 — 백업은 서비스를 잠깐 멈추고 파일을 복사한다.
    url: jdbc:h2:file:${DAMSO_DB:./data/damso};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      # H2 파일 DB 는 한 프로세스가 독점한다. 커넥션을 늘려도 디스크가 빨라지지 않는다.
      maximum-pool-size: 10

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  # 운영에서 H2 콘솔은 절대 열지 않는다. (인증 없이 DB 전체가 노출된다)
  h2:
    console:
      enabled: false

damso:
  # 개인정보 암호화 키. DAMSO_DATA_KEY 환경변수가 없으면 이 파일을 쓴다(없으면 만든다).
  # 앱 디렉터리는 업데이트 때 통째로 바뀌므로 반드시 그 바깥(C:\damso)에 둔다.
  # AWS 에서 가져온 키를 그대로 놓아야 기존 이름·전화번호가 읽힌다. 잃으면 복구할 수 없다.
  data-key-file: ${DAMSO_DATA_KEY_FILE:./data/damso.key}
  # jar 하나가 프론트와 API 를 같은 오리진에서 서빙하므로 CORS 가 필요 없다.
  cors:
    allowed-origin-patterns: ""
  # 운영에는 테스트 계정(test/test1234)을 만들지 않는다.
  seed-test-user: false

server:
  # cloudflared 가 앞에 있으므로 X-Forwarded-* 를 신뢰해 원래 스킴(https)/호스트를 인식한다.
  # 이게 없으면 앱이 http 로 착각해 카카오/네이버 콜백 주소를 http 로 만든다.
  forward-headers-strategy: framework
  shutdown: graceful
  # cloudflared 가 같은 PC 에서 접속하므로 루프백만 열면 된다. 공유기 포트포워딩도 하지 않는다.
  # LAN 의 다른 기기에서 직접 붙어 봐야 할 때만 DAMSO_BIND=0.0.0.0 으로 잠시 바꾼다.
  address: ${DAMSO_BIND:127.0.0.1}

logging:
  level:
    root: INFO
    com.damso.match: INFO
    org.hibernate.SQL: WARN
  # 콘솔 없이 백그라운드로 도는 서비스라 파일 로그가 유일한 단서다.
  file:
    name: ${DAMSO_LOG:./logs/damso.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
