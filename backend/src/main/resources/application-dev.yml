### 로컬 개발 프로파일 (프로파일 미지정 시 기본값).
### Swagger · 느슨한 CORS · 테스트 계정 — 전부 개발 편의용이다.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

damso:
  # 프론트를 Vite 개발 서버(5173)에서 띄우고, 휴대폰이 LAN IP 로 접속하므로 모든 오리진을 허용한다.
  cors:
    allowed-origin-patterns: "*"
  seed-test-user: true

logging:
  level:
    com.damso.match: DEBUG
    org.hibernate.SQL: INFO
