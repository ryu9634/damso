name: 배포

# main 에 올라가면 배포한다. 손으로 돌리고 싶을 때는 Actions 탭에서 직접 실행할 수도 있다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 릴리스 심볼릭 링크가 꼬인다. 앞의 배포가 끝날 때까지 기다린다(취소하지 않는다).
concurrency:
  group: deploy-production
  cancel-in-progress: false

# id-token 은 AWS 에 OIDC 로 로그인하기 위해 필요하다. 액세스 키를 시크릿에 두지 않는 대가다.
# contents: write 는 빌드한 jar 을 릴리스에 올리기 위해 필요하다 — 집 PC 가 그걸 받아 간다.
permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # ── 프론트 ────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          # 루트에 package-lock.json 이 없으므로 캐시 키를 만들 파일을 알려 준다.
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트 빌드
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: dist 확인
        # frontend/dist/ 가 없으면 Maven 의 복사 단계는 조용히 건너뛰고 프론트 없는 jar 이 나온다.
        # 배포 후 흰 화면으로 알게 되는 대신 여기서 멈춘다.
        run: test -f frontend/dist/index.html

      # ── 서버 ──────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 테스트가 깨지면 여기서 멈춘다. 배포된 뒤 손님 앞에서 알게 되는 것보다 낫다.
      - name: 테스트
        working-directory: backend
        run: mvn -B test

      - name: jar 빌드
        # 바로 위에서 이미 돌렸으므로 여기서는 다시 돌리지 않는다.
        working-directory: backend
        run: mvn -B clean package -DskipTests

      - name: jar 에 프론트가 들어갔는지 확인
        run: |
          JAR=$(ls backend/target/match-*.jar | grep -v '\.original$' | head -1)
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          jar tf "$JAR" | grep -q '^BOOT-INF/classes/static/index.html$'

      # ── 릴리스 게시 ───────────────────────────────────────
      # 집 PC(deploy/windows/update.ps1)는 여기 올라온 jar 만 받아 간다.
      # 그래서 그 PC 에는 JDK 만 있으면 되고 Node·Maven·소스는 필요 없다.
      #
      # latest 태그 하나를 계속 덮어쓴다. update.ps1 이 보는 곳은 항상 /releases/latest 이므로
      # 버전마다 릴리스를 새로 만들면 오히려 "어느 게 최신인가"가 흔들린다.
      - name: 릴리스에 jar 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="커밋 ${GITHUB_SHA::7} — $(date -u '+%Y-%m-%d %H:%M UTC') 빌드

          집 PC 에서 받기:  powershell -File C:\\damso\\bin\\update.ps1"

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "$JAR" --clobber
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest "$JAR" \
              --title "최신 빌드" --notes "$NOTES" --latest
          fi
          echo "## 📦 릴리스 갱신 — latest" >> "$GITHUB_STEP_SUMMARY"

      # ── 배포 ──────────────────────────────────────────────
      # SSH 를 쓰지 않는다. jar 을 S3 에 올리고 SSM 으로 서버에 배포 명령을 보낸다.
      # 서버는 22번을 포함해 인바운드를 하나도 열 필요가 없다 — SSM 은 서버가 밖으로 거는 연결만 쓴다.
      - name: 배포 시크릿 확인
        id: check
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          # 서버를 아직 준비하지 않은 단계에서도 빌드 검증은 의미가 있다.
          # 다만 조용히 넘어가면 시크릿이 지워졌을 때 배포가 멈춘 걸 모르게 되므로,
          # 경고와 요약으로 눈에 띄게 남긴다.
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AWS_ROLE_ARN 시크릿이 없어 배포를 건너뜁니다 (빌드까지만 검증)."
            echo "## ⏭ 배포 건너뜀" >> "$GITHUB_STEP_SUMMARY"
            echo "배포 시크릿(\`AWS_ROLE_ARN\`)이 설정되지 않았습니다. 빌드와 jar 검증까지만 수행했습니다." >> "$GITHUB_STEP_SUMMARY"
            echo "설정 방법은 [DEPLOY.md](../blob/main/docs/DEPLOY.md) 참고." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: AWS 로그인 (OIDC)
        if: steps.check.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: jar 을 S3 에 업로드
        if: steps.check.outputs.ready == 'true'
        env:
          BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          RELEASE="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          aws s3 cp "$JAR" "s3://$BUCKET/releases/$RELEASE.jar"

      - name: SSM 으로 릴리스 교체
        if: steps.check.outputs.ready == 'true'
        env:
          BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
        run: |
          set -euo pipefail

          # 서버에서 돌 명령. deploy.sh 가 헬스체크까지 하고, 실패하면 이전 릴리스로 되돌린 뒤
          # 0 이 아닌 값으로 끝난다. 즉 이 스텝이 실패했다면 서비스는 이전 버전으로 살아 있다는 뜻이다.
          jq -n --arg r "$RELEASE" --arg b "$BUCKET" --arg reg "$AWS_REGION" '{
            commands: [
              "set -e",
              "aws s3 cp s3://\($b)/releases/\($r).jar /tmp/match-\($r).jar --region \($reg) --no-progress",
              "chmod 644 /tmp/match-\($r).jar",
              "sudo -u deploy /opt/damso/bin/deploy.sh /tmp/match-\($r).jar \($r)",
              "rm -f /tmp/match-\($r).jar"
            ]
          }' > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "damso deploy $RELEASE" \
            --timeout-seconds 600 \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)
          echo "SSM 명령 $CMD_ID"

          # send-command 직후 잠깐은 InvocationDoesNotExist 가 온다. Pending 으로 보고 계속 기다린다.
          STATUS=Pending
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          echo "--- 서버 출력 ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "--- 오류 출력 ---"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text || true
            echo "::error::배포 실패 ($STATUS). 서비스는 이전 릴리스로 살아 있습니다."
            exit 1
          fi
          echo "## ✅ 배포 완료 — $RELEASE" >> "$GITHUB_STEP_SUMMARY"
