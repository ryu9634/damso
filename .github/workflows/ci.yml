name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 백엔드 테스트 (PostgreSQL / Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 러너에 Docker 가 있으므로 Testcontainers 가 PostgreSQL 컨테이너를 직접 띄운다.
      - name: 테스트
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: 프론트 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 타입 검사 + 빌드
        working-directory: frontend
        run: |
          npm ci
          npm run build
